<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Square with Luxury Deep Denim Navy Gradient -->
  <rect width="100" height="100" rx="26" fill="#0C1527"/>
  <rect x="3" y="3" width="94" height="94" rx="23" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>

  <!-- Outer Shield Path -->
  <path 
    d="M50 12 L82 25 V54 C82 72 50 90 50 90 C50 90 18 72 18 54 V25 L50 12 Z" 
    fill="#1E3A8A" 
    fill-opacity="0.45"
    stroke="#D97706" 
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Inner Golden Stitch Track -->
  <path 
    d="M50 20 L74 30 V52 C74 65 50 80 50 80 C50 80 26 65 26 52 V30 L50 20 Z" 
    stroke="#F59E0B" 
    stroke-width="2" 
    stroke-dasharray="4 3" 
    stroke-linecap="round"
  />

  <!-- Letter S in Burnished Gold -->
  <path 
    d="M36 36 C36 30 42 27 50 27 C58 27 62 30 62 35 C62 40 56 43 46 45 C37 47 33 51 33 57 C33 64 41 68 50 68 C59 68 65 64 65 59" 
    stroke="#FBBF24" 
    stroke-width="6.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Letter F in Brilliant Crisp White (Intertwined) -->
  <path 
    d="M52 33 H70 M52 33 V69 M52 50 H66" 
    stroke="#FFFFFF" 
    stroke-width="6.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Center Golden Artisan Star Rivet -->
  <circle cx="50" cy="20" r="3.5" fill="#F59E0B" />
  <circle cx="50" cy="20" r="1.5" fill="#FFFBEB" />
</svg>
